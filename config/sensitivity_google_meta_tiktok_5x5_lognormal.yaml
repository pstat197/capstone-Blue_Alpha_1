    - amazon
  kpi_col: subscriptions

experiment:
  # 5x5x1 design (LogNormal only). Keep centralized here.
  multipliers: [0.4, 0.7, 1.0, 1.4, 2.0]
  roi_mu_values: null
  roi_sigma_values: null
  roi_dist_values: [LogNormal]

structural:
  alpha_m_values: [0.3]
  ec_m_values: [0.5]
  slope_m_values: [1.2]
