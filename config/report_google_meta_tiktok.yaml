project:
  title: "Prior Sensitivity Analysis Framework for Bayesian Marketing Mix Models (MMM)"
  subtitle: "Google Meridian MMM - Prior Robustness Diagnostics"
  authors:
    - "Aidan Frazier"
    - "Quinlan Wilson"
    - "Jimmy Wu"
    - "Jasper Luo"
    - "Coraline Zhu"

branding:
  cobrand_label: "UCSB x BlueAlpha AI"
  logos:
    ucsb: "src/reporting/assets/ucsb_seal_gold.gif"
    bluealpha: "src/reporting/assets/bluealpha_mark_blue.png"

introduction:
  title: "Introduction"
  paragraphs:
    - "Marketing Mix Models (MMM) are widely used by companies to evaluate the effectiveness of marketing channels and guide budget allocation decisions. Recent Bayesian MMM frameworks, such as Google Meridian, allow analysts to incorporate prior information into model estimation."
    - "However, Bayesian models can be sensitive to prior assumptions. Small changes in prior parameters may lead to large differences in estimated ROI for marketing channels. Understanding this sensitivity is critical for building reliable MMM models."
    - "This project proposes a systematic prior sensitivity analysis framework that evaluates how ROI estimates change across different prior configurations. The framework generates automated diagnostic reports that help analysts identify unstable parameters and improve model robustness."

baseline:
  rule: "median"

ranking:
  top_n: 10
  score: "max_abs_pct_change"

thresholds:
  high_sensitivity_pct: 15.0
  medium_sensitivity_pct: 7.5

analysis:
  # all: show all modeled channels in report
  channel_scope: "all"
  # scenario_selection:
  # - largest_total_abs_pct_non_fail (recommended)
  # - largest_total_abs_pct
  # - first_non_baseline
  scenario_selection: "largest_total_abs_pct_non_fail"

figures:
  dpi: 160
  make_tornado: true
  make_spend_effect: true
  spend_effect_top_n: 8
  tornado_range_mode: "p05p95"
  tornado_top_n: 10
  make_scenario_snapshot: true
  scenario_snapshot_top_n: 8
  scenario_snapshot_max_runs: 6
  make_structural: true
  structural_top_profiles: 4
  structural_top_runs: 12
  carryover_top_channels: 10
  make_heatmaps: true
  heatmap_top_n: 4
  heatmap_grid_rows: 2
  heatmap_grid_cols: 2
  heatmap_annotate_cells: true
  heatmap_scale_mode: "robust_q95"  # robust_q95 | abs_max
  heatmap_compare_scales: false

theory:
  enabled: false
  title: "Linked Math Theory"
  source_tex: "docs/theory/prior-sensitivity-theory.tex"
  max_subsections: 8
  max_equations: 8
  highlights:
    - "Posterior response is a weighted balance of data signal and prior pull."
    - "Mu shifts move attribution center; sigma shifts change shrinkage strength."
    - "Cross-channel reallocation appears under joint posterior estimation and collinearity."
    - "Heatmap surfaces represent ROI response over the tested (mu, sigma) prior grid."

methods:
  baseline_description: "Baseline ROI is defined at the median prior mean (mu) and median prior standard deviation (sigma) within each channel and distribution family."
  sensitivity_description: "For each scenario, percent change is computed relative to that channel-specific baseline ROI. Sensitivity is summarized using maximum absolute percent change across tested prior settings."
  visualization_description: "The report includes spend-vs-effect one-pager alignment, ROI/value tornado views, structural adstock-saturation diagnostics (decay, carryover, saturation curves), a single-run channel snapshot, and 2x2 heatmap boards for sensitive channel-prior combinations."

output:
  report_filename: "report.html"
  show_appendix: false


