model:
  channels: [meta, google, snapchat, tiktok, moloco, liveintent, beehiiv, amazon]
  data_csv: "data/raw/monthly_mocha_geo.csv"
  data_tag: "monthly_mocha_geo"
  kpi_col: "subscriptions"
  time_col: "date"
  geo_col: "state"
  population_col: "population"

experiment:
  multipliers: [0.4, 1.0, 2.0]
  roi_mu_values: null
  roi_sigma_values: null
  roi_dist_values: [Normal, LogNormal]

structural:
  alpha_m_values: [0.3]
  ec_m_values: [0.5]
  slope_m_values: [1.2]
  max_lag_values: [4]
  adstock_decay_values: [geometric]

sampler:
  n_chains: 4
  n_adapt: 700
  n_burnin: 500
  n_keep: 300
  seed: 0
