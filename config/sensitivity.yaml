run_mode: fast_product
parallel_workers: 4

run_modes:
  fast_product:
    roi_mu_values: [0.5, 1.0, 1.5, 2.5, 4.0]
    roi_sigma_values: [1.0, 1.5, 2.0]
    roi_dist_values: [LogNormal]
    contribution_mean_values: [0.005, 0.01, 0.02, 0.05, 0.15]
    contribution_scale_values: [0.005, 0.02, 0.05]
    contribution_dist_values: [LogNormal]
    n_chains: 2
    n_adapt: 300
    n_burnin: 300
    n_keep: 150
  audit_research:
    roi_mu_values: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0]
    roi_sigma_values: [0.5, 1.0, 1.5, 2.0]
    roi_dist_values: [LogNormal]
    contribution_mean_values: [0.005, 0.01, 0.02, 0.05, 0.075, 0.10, 0.15]
    contribution_scale_values: [0.005, 0.01, 0.02, 0.05]
    contribution_dist_values: [LogNormal]
    n_chains: 4
    n_adapt: 700
    n_burnin: 500
    n_keep: 300

model:
  channels: [meta, google, snapchat, tiktok, moloco, liveintent, beehiiv, amazon]
  data_csv: data/raw/monthly_mocha.csv
  data_tag: null
  time_col: date
  geo_col: null
  population_col: null

outcome:
  kpi_col: subscriptions
  # auto | revenue | non_revenue
  kpi_type: non_revenue
  # Optional single value for revenue-equivalent conversion.
  revenue_per_kpi: null
  # Optional list for sensitivity across multiple assumptions.
  revenue_per_kpi_values: null

prior_mode: auto

sweep:
  type: fixed_full_grid
  # full_grid | baseline_only
  prior_grid_scope: full_grid
  # full_grid = Cartesian product across prior x structural.
  # one_at_a_time = staged additive:
  #   all prior points @ baseline structural
  #   + baseline prior @ one-at-a-time structural variants
  structural_grid_scope: one_at_a_time

structural:
  alpha_m_values: [0.3, 0.2, 0.4]
  ec_m_values: [0.5, 0.3, 0.7]
  slope_m_values: [1.2, 1.0, 1.4]
  max_lag_values: [4, 2, 6]
  adstock_decay_values: [geometric, binomial]

baseline:
  roi_mu: 1.5
  roi_sigma: 1.5
  roi_dist: LogNormal
  contribution_mean: 0.02
  contribution_scale: 0.02

defaults:
  targets: [google, meta, tiktok]
  target_sets: null

sampler:
  # n_chains/n_adapt/n_burnin/n_keep are injected from run_modes[run_mode].
  n_chains: 4
  n_adapt: 700
  n_burnin: 500
  n_keep: 300
  seed: 0
