run_mode: roi_full
parallel_workers: 4

run_modes:
  roi_full:
    roi_mu_values: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
    roi_sigma_values: [0.5, 1.0, 1.5]
    roi_dist_values: [LogNormal]
    n_chains: 4
    n_adapt: 700
    n_burnin: 500
    n_keep: 300

model:
  channels: [meta, google, snapchat, tiktok, moloco, liveintent, beehiiv, amazon]
  data_csv: data/raw/monthly_mocha.csv
  data_tag: null
  time_col: date
  geo_col: null
  population_col: null

outcome:
  kpi_col: subscriptions
  # auto | revenue | non_revenue
  kpi_type: non_revenue
  # Optional single value for revenue-equivalent conversion.
  revenue_per_kpi: 40.0
  # Optional list for sensitivity across multiple assumptions.
  revenue_per_kpi_values: null

prior_mode: roi

sweep:
  type: fixed_full_grid
  # full_grid | baseline_only
  prior_grid_scope: full_grid
  # full_grid = Cartesian product across prior x structural.
  # Structural grid is fixed to one baseline point in this ROI-only workflow.
  structural_grid_scope: full_grid

structural:
  alpha_m_values: [0.3]
  ec_m_values: [0.5]
  slope_m_values: [1.2]
  max_lag_values: [4]
  adstock_decay_values: [geometric]

baseline:
  roi_mu: 1.5
  roi_sigma: 1.5
  roi_dist: LogNormal

defaults:
  targets: [meta, google, snapchat, tiktok, moloco, liveintent, beehiiv, amazon]
  target_sets: null

sampler:
  # n_chains/n_adapt/n_burnin/n_keep are injected from run_modes[run_mode].
  n_chains: 4
  n_adapt: 700
  n_burnin: 500
  n_keep: 300
  seed: 0
