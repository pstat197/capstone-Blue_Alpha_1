model:
  channels:
    - meta
    - google
    - snapchat
    - tiktok
    - moloco
    - liveintent
    - beehiiv
    - amazon
  kpi_col: subscriptions

experiment:
  multipliers: [0.4, 1.0, 2.0]
  roi_mu_values: null
  roi_sigma_values: null
  roi_dist_values: [Normal, LogNormal]

defaults:
  targets: [tiktok]

sampler:
  n_chains: 4
  n_adapt: 700
  n_burnin: 500
  n_keep: 300
  seed: 0

next_grid_policy:
  min_dist_pass_rate: 0.7
  max_baseline_issue_rate: 0.1
  min_param_pass_rate: 0.6
  fallback_keep_all_dists: true
